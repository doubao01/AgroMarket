name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同分支上的新提交取消旧的一轮, 省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与集成测试
    runs-on: ubuntu-latest

    # 测试套件是黑盒集成测试: 打真实 HTTP + 真实 MySQL, 不是 mock。
    # 所以这里必须起一个真的数据库并跑完全部迁移。
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-pw
          MARIADB_DATABASE: agro_market
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    # 仅用于 CI 的一次性配置。生产/部署请按 README 与 .env.example 自行生成。
    # 注意: 这些值通过环境变量下发, 会被子进程继承 —— 测试套件会用它们拉起独立的 API 实例。
    #
    # 这里只覆盖「与 CI 环境相关」的少数项(连接串、JWT 密钥); 其余非机密配置
    # (Sms/Payment/Ai/Federation) 一律取自 appsettings.Development.json.example。
    # 不要在此逐项列举它们: 否则模板新增配置项时 CI 会静默漏配 —— 本项目就曾因
    # 漏配 Federation:ForwardReceived / AcceptForwarded 而导致联动用例失败。
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=agro_market;User=root;Password=ci-root-pw;DefaultCommandTimeout=30;"
      Jwt__SecretKey: "ci-only-jwt-secret-key-not-for-production-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: 安装 MariaDB 客户端
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: 初始化数据库(全部迁移 + 演示账号)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASS: ci-root-pw
          SEED_DEMO: "1"
        run: ./database/init-db.sh

      # 采用与 CONTRIBUTING 完全相同的开发者流程生成配置, 保证「按文档搭建 = 测试全绿」。
      # 集成测试覆盖联动模块, 需要 Federation:Enabled/NodeCode 等项, 这些都在模板里。
      # 环境变量优先级高于本文件, 故上面的 CI 连接串等仍会生效。
      - name: 生成开发配置(同 CONTRIBUTING 的模板流程)
        run: cp backend/AgroMarket.Api/appsettings.Development.json.example backend/AgroMarket.Api/appsettings.Development.json

      # 必须构建 Debug: 测试套件的 AI E2E 段会探测 Api/bin/Debug/net10.0/AgroMarket.Api.dll,
      # 找不到就整段 SKIP —— CI 会"通过"但少测一大块。
      - name: 构建
        run: dotnet build backend/AgroMarket.slnx -c Debug --nologo

      - name: 启动 API 并等待就绪
        run: |
          nohup dotnet run --no-build -c Debug --project backend/AgroMarket.Api \
            --urls http://127.0.0.1:8080 > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "API 就绪 (第 ${i} 次探测)"; exit 0
            fi
            sleep 2
          done
          echo "::error::API 未能在 120s 内就绪"; tail -60 api.log; exit 1

      - name: 集成测试
        run: dotnet run --no-build -c Debug --project backend/AgroMarket.Tests -- http://127.0.0.1:8080

      - name: API 日志(失败时)
        if: failure()
        run: tail -100 api.log || true

  frontend:
    name: 前端 H5 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建 H5
        run: npm run build:h5
